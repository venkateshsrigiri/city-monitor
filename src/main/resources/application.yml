spring:
  application:
    name: incident-service

  datasource:
    url: jdbc:postgresql://localhost:5432/incidentdb
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  graphql:
    graphiql:
      enabled: true
      path: /graphiql
    path: /graphql

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    mongodb:
      uri: mongodb://localhost:27017
      database: trafficdb
    redis:
      host: localhost
      port: 6379
    # FIX: Spring Data Elasticsearch needs this separate stanza to wire
    # ElasticsearchClient. Without it the IncidentSearchRepository bean
    # fails to initialise at startup, causing ALL endpoints to 500.
    elasticsearch:
      repositories:
        enabled: true

  elasticsearch:
    uris: http://localhost:9200
    # Explicit socket/connect timeouts so a slow/offline ES does not
    # stall the whole app boot and cause cascading 500s.
    connection-timeout: 5s
    socket-timeout: 30s

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: incident-consumer-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.smart.traffic.kafka

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    com.smart.traffic: DEBUG
    org.springframework.kafka: INFO
    org.hibernate.SQL: DEBUG

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  packages-to-scan: com.smart.traffic.controller
  paths-to-match: /api/**
  show-actuator: false